    heat_index:
      danger: 41.0
      extreme_danger: 54.0
    humidity:
      high_mean: 95.0
      low_min: 10.0
    wind_beaufort:
      B8_gale: 62.0
      B9_strong_gale: 75.0
      B10_storm: 89.0
      B11_violent_storm: 103.0
      B12_hurricane: 118.0
    wet_day_mm: 1.0
    zscore: 3.0
    iqr_k: 3.0
    spells:
      heatwave_min_days: 3
      warm_spell_min_days: 6
