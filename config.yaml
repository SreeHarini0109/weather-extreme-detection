# Central configuration for the Weather Data Processing & Extreme Weather Detection project.
# Every engine (sequential, multiprocessing, MPI, Spark) reads this same file so results are comparable.

paths:
  stations: data/stations.csv
  raw_synthetic: data/raw/synthetic
  raw_openmeteo: data/raw/openmeteo
  parquet: data/parquet/synthetic
  results: results

generator:
  start_year: 1995
  end_year: 2024
  seed: 42
  n_stations: 50            # > 50 creates "virtual" stations perturbed from the base 50
  workers: 8
  format: parquet           # parquet | csv  (raw output format)
  warming_per_decade: [0.05, 0.45]   # true station trend drawn uniformly from this range
  no_trend_fraction: 0.2             # fraction of stations given ~0 trend (controls for MK test)
  inject:                   # injected extremes (events / station / year) -> ground truth
    heatwave_rate: 0.5
    coldwave_rate: 0.3
    cloudburst_rate: 0.3
    cyclone_rate: 0.25      # coastal stations only
    rate_growth_per_year: 0.03   # extremes become more frequent over time
  quality:                  # injected data-quality problems the cleaning phase must handle
    nan_frac: 0.001
    spike_frac: 0.00005
    dup_frac: 0.00005

downloader:
  start: "1995-01-01"
  end: "2024-12-31"
  requests_per_second: 4
  chunk_years: 10
  threads: 4

cleaning:
  round_decimals: 2
  temp_range: [-90, 60]
  humidity_range: [0, 100]
  humidity_clip_tolerance: 2
  precip_range: [0, 500]
  wind_range: [0, 400]
  min_hours_complete: 20

thresholds:
  # IMD rules apply to stations in imd.countries only (they are India's criteria); elsewhere the
  # station-relative detectors (P99 / z-score / warm spells, ETCCDI-style) cover heat and cold.
  imd:        {countries: [IN], hill_elevation_m: 1000, apply_everywhere: false}
  heatwave:   {tmax_min: 40.0, hill_tmax_min: 30.0, departure: 4.5, severe_departure: 6.5, absolute: 45.0, severe_absolute: 47.0}
  coldwave:   {tmin_max: 10.0, hill_tmin_max: 0.0, departure: -4.5, severe_departure: -6.5, absolute: 4.0, severe_absolute: 2.0}
  heavy_rain: {heavy: 64.5, very_heavy: 115.6, extremely_heavy: 204.5}
  cloudburst_mm_per_hour: 100.0
  heat_index: {danger: 41.0, extreme_danger: 54.0}
  humidity:   {high_mean: 95.0, low_min: 10.0}
  wind_beaufort: {B8_gale: 62.0, B9_strong_gale: 75.0, B10_storm: 89.0, B11_violent_storm: 103.0, B12_hurricane: 118.0}
  wet_day_mm: 1.0
  zscore: 3.0
  iqr_k: 3.0
  spells: {heatwave_min_days: 3, warm_spell_min_days: 6}

# Fixed-bin histograms used for (distributed) percentile estimation. Error <= width / 2.
histograms:
# Bin edges are offset by half a bin so values on the 0.1 data grid fall mid-bin (robust to floating point).
  tmax:       {lo: -60.05, hi: 60.05, width: 0.1}
  tmin:       {lo: -60.05, hi: 60.05, width: 0.1}
  precip_wet: {lo: -0.25, hi: 1000.25, width: 0.5}
  wind_max:   {lo: -0.05, hi: 300.05, width: 0.1}

trends:
  min_days_per_year: 300
  min_years: 8
  alpha: 0.05

mpi:
  halo_days: 31             # ghost rows exchanged between neighbouring ranks in time mode

spark:
  shuffle_partitions: 16
  driver_memory: 4g
  approx_accuracy: 10000

# Streaming extension (streaming/): a replayer feeds stored hourly data back as a live feed into a
# landing directory; Spark Structured Streaming turns it into daily values and alerts.
streaming:
  landing: data/stream/landing          # replayer -> Spark file source (one Parquet file per step)
  checkpoint: data/stream/checkpoint    # Spark offsets/state + detector state (restart resumes)
  output: results/stream                # alerts.jsonl, daily.csv, events.csv, progress.json per run
  step_hours: 6                         # simulated hours per landing file
  speed_days_per_second: 1.0            # replay speed (0 = as fast as possible)
  watermark_delay: 2 hours              # how late an hourly reading may arrive before its day is closed
  trigger_seconds: 1                    # micro-batch interval
  max_files_per_trigger: 64             # upper bound per micro-batch (keeps up with fast replays)
  scenarios:                            # python -m streaming.demo --scenario <name>
    heatwave_2024: {data: data/parquet/real, baseline: results/era5_latest, start: "2024-05-01", end: "2024-06-30",
                    title: "North India heatwave, May-June 2024 (ERA5)"}
    amphan_2020:   {data: data/parquet/real, baseline: results/era5_latest, start: "2020-05-10", end: "2020-05-31",
                    title: "Cyclone Amphan, May 2020 (ERA5)"}
    michaung_2023: {data: data/parquet/real, baseline: results/era5_latest, start: "2023-11-25", end: "2023-12-10",
                    title: "Cyclone Michaung, Dec 2023 (ERA5)"}
    synthetic_2024: {data: data/parquet/synthetic, baseline: results/mpi_latest, start: "2024-04-01", end: "2024-07-31",
                     title: "Synthetic network, Apr-Jul 2024 (50 stations)"}
